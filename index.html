<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Barra de Carga Roja</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <div class="progress-track">
            <div class="progress-bar" id="miBarra"></div>
        </div>
        
        <button onclick="activarCarga()">Iniciar Carga</button>
    </div>

    <script>
        function activarCarga() {
            const barra = document.getElementById('miBarra');
            
            // Reiniciamos la animación por si se pulsa el botón varias veces
            barra.classList.remove('cargando');
            void barra.offsetWidth; // Truco para forzar el reinicio (reflow)
            
            // Añadimos la clase que contiene la animación
            barra.classList.add('cargando');
        }
    </script>
</body>
</html>
